<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Empire Builder: Side Hustle Grind 🚀</title>
  <link rel="stylesheet" href="style.css?v=3.0.1" />
</head>
<body class="theme-regal">
  <!-- Theme Toggle -->
  <div id="theme-selector" class="theme-bar">
        <button onclick="switchTheme('sunset')" class="theme-btn" data-theme="sunset">🌅</button>
        <button onclick="switchTheme('ocean')" class="theme-btn" data-theme="ocean">🌊</button>
        <button onclick="switchTheme('forest')" class="theme-btn" data-theme="forest">🌲</button>
        <button onclick="switchTheme('neon')" class="theme-btn" data-theme="neon">🌃</button>
        <button onclick="switchTheme('gray')" class="theme-btn" data-theme="gray">⚪</button>
        <button onclick="switchTheme('regal')" class="theme-btn active" data-theme="regal">
          <span style="font-size: 1.3rem;">👑</span>
        </button>
        <button onclick="switchTheme('chewy')" class="theme-btn" data-theme="chewy">
          <span style="font-size: 1.3rem;">🍬</span>
        </button>
  </div>

  <!-- Header -->
  <header class="game-header">
    <h1>Empire Builder</h1>
    <p class="subtitle">Side Hustle Grind Edition</p>
        <div id="prestige-display" class="prestige-badge hidden">
          <span style="font-size: 1.2rem;">🌟</span> Prestige Level: <span id="prestige-level">0</span>
        </div>
  </header>

  <!-- Main Game Area -->
  <main class="game-container">
    <!-- Clicker Section -->
    <section class="clicker-section">
      <button class="cash-register" onclick="handleClick(event)" aria-label="Click to earn cash">
        <svg viewBox="0 0 64 64" width="80" height="80">
          <circle cx="32" cy="32" r="30" fill="#d4af37" opacity="0.15"/>
          <path d="M20 20h24v8H20zM20 36h24v8H20z" fill="#d4af37"/>
          <circle cx="32" cy="24" r="4" fill="#ffffff"/>
        </svg>
        <p class="register-label">Click to Earn</p>
      </button>

      <!-- Stats Display -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Cash</span>
          <span class="stat-value" id="cash-display" style="color: var(--primary-color);">$0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Click Power</span>
          <span class="stat-value" id="click-power-display" style="color: var(--primary-color);">$1/click</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Revenue/Sec</span>
          <span class="stat-value" id="rps-display" style="color: var(--success-color);">$0/s</span>
        </div>
      </div>

      <!-- Equipment Upgrades -->
      <section class="upgrades-section">
        <h2 style="color: var(--primary-color);">Equipment</h2>
        <div class="upgrades-list" id="equipment-container" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Equipment injected via JS -->
        </div>
      </section>

      <!-- Business Side Hustles Section -->
      <section class="upgrades-section">
        <h2 style="color: var(--success-color);">Side Hustles</h2>
        <div class="upgrades-list" id="upgrades-container">
          <!-- Upgrades injected via JS -->
        </div>
      </section>

      <!-- Prestige Button -->
      <section class="prestige-section">
        <button id="prestige-btn" class="btn-prestige hidden" onclick="triggerPrestige()">
          <span style="font-size: 1.2rem;">🌟</span> Prestige
        </button>
        <p class="prestige-info">Unlock at $500k lifetime earnings — permanent +50% multiplier per level (max 5)</p>
        <button id="reset-save-btn" class="btn-reset" onclick="resetSave()">Reset Save</button>
      </section>

    </section>

    <!-- Log Section -->
    <aside class="game-log">
      <h3>Activity Log</h3>
      <div id="log-container"></div>
    </aside>
  </main>

  <script src="script.js?v=3.0.1"></script>
</body>
</html>
